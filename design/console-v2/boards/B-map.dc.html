<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方案 B 现场地图台</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#5AA2E6}a:hover{color:#CFE4FA}
.btn{height:40px;padding:0 16px;border:1px solid #9A9FA6;border-radius:2px;background:#16191D;color:#ECEDEA;font:600 14px Barlow,"Noto Sans SC","Microsoft YaHei UI",sans-serif;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.pri{background:#1F6FC0;border-color:#1F6FC0;color:#fff;font-weight:700}
.btn.stop{background:#D42F33;border-color:#D42F33;color:#fff;font-weight:700}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;color:#9A9FA6}
.ring{display:inline-block;flex:none;width:12px;height:12px;border:3px solid #FF6166;border-radius:50%;box-sizing:border-box}
.tri{display:inline-block;flex:none;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid #F2B01E}
.sq{display:inline-block;flex:none;width:9px;height:9px;background:#3DC46E}
.disc{display:inline-block;flex:none;width:10px;height:10px;border-radius:50%;background:#fff}
.panel{background:#16191D;border:1px solid #2E333A;box-shadow:0 8px 24px rgba(0,0,0,.45)}
</style>
</helmet>
<div style="width:1440px;height:900px;box-sizing:border-box;background:#0E1013;color:#ECEDEA;font-family:Barlow,'Noto Sans SC','Microsoft YaHei UI',sans-serif;font-size:14px;line-height:20px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column">

  <header style="height:56px;flex:none;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid #2E333A;background:#0A0C0E">
    <div style="display:flex;flex-direction:column;line-height:14px"><b style="font-size:13px;letter-spacing:.12em">NEXUS</b><span style="font-size:11px;letter-spacing:.12em;color:#B4B8BE">WARDEN</span></div>
    <nav aria-label="主导航" style="display:flex;gap:4px;margin-left:16px">
      <a href="#" aria-current="page" style="height:56px;display:flex;align-items:center;padding:0 14px;color:#ECEDEA;text-decoration:none;font-weight:700;box-shadow:inset 0 -3px 0 #1F6FC0">现场</a>
      <a href="#" style="height:56px;display:flex;align-items:center;padding:0 14px;color:#B4B8BE;text-decoration:none;font-weight:600">记录</a>
      <a href="#" style="height:56px;display:flex;align-items:center;padding:0 14px;color:#B4B8BE;text-decoration:none;font-weight:600">设置</a>
    </nav>
    <div role="group" aria-label="地图层" style="display:inline-flex;border:1px solid #2E333A;margin-left:8px">
      <button class="btn sm" type="button" aria-pressed="true" style="border:0;background:#1F6FC0;color:#fff">全部</button>
      <button class="btn sm" type="button" style="border:0;background:transparent">只看报警</button>
      <button class="btn sm" type="button" style="border:0;background:transparent">巡逻路线</button>
      <button class="btn sm" type="button" style="border:0;background:transparent">防区</button>
    </div>
    <div style="flex:1"></div>
    <span style="display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;background:#16281D;color:#3DC46E;font-weight:600"><span class="sq"></span>布防中</span>
    <span style="font-size:15px">23:48</span>
    <span style="color:#B4B8BE">gina</span>
    <button class="btn stop" type="button"><span style="width:12px;height:12px;border:2px solid #fff;border-radius:50%;box-sizing:border-box"></span>全部叫停</button>
  </header>

  <!-- 地图铺满 -->
  <div style="flex:1;min-height:0;position:relative;overflow:hidden;background:#15181C">
    <svg viewBox="0 0 1440 700" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true">
      <defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1D2126" stroke-width="1"/></pattern></defs>
      <rect width="1440" height="700" fill="url(#g)"/>
      <path d="M180 80 H1260 V300 H980 V640 H560 V300 H180 Z" fill="#232830" stroke="#6A7078" stroke-width="3"/>
      <rect x="600" y="360" width="300" height="200" fill="#1B1F24" stroke="#5F646A" stroke-dasharray="6 4"/>
      <text x="750" y="466" fill="#9A9FA6" font-size="18" text-anchor="middle">2 号楼</text>
      <rect x="200" y="100" width="340" height="180" fill="none" stroke="#5AA2E6" stroke-opacity=".35" stroke-width="2"/>
      <text x="212" y="124" fill="#5AA2E6" fill-opacity=".8" font-size="14">北区 · 布防</text>
      <path d="M1180 180 H700 V330 H1180 Z" fill="none" stroke="#9A9FA6" stroke-opacity=".35" stroke-width="2" stroke-dasharray="2 6"/>
      <path d="M980 180 C 820 180, 700 220, 640 300" fill="none" stroke="#5AA2E6" stroke-width="4" stroke-dasharray="10 6"/>
      <circle cx="340" cy="110" r="34" fill="none" stroke="#FF6166" stroke-width="10"/>
      <circle cx="340" cy="110" r="52" fill="none" stroke="#FF6166" stroke-opacity=".35" stroke-width="2"/>
      <circle cx="980" cy="180" r="14" fill="#3DC46E" stroke="#0E1013" stroke-width="3"/>
      <text x="980" y="158" fill="#ECEDEA" font-size="18" font-weight="700" text-anchor="middle">A</text>
      <circle cx="260" cy="590" r="14" fill="#3DC46E" stroke="#0E1013" stroke-width="3"/>
      <text x="260" y="568" fill="#ECEDEA" font-size="18" font-weight="700" text-anchor="middle">B</text>
      <path d="M1230 100 l14 0 l0 10 l-14 0 z" fill="#ECEDEA"/><text x="1237" y="130" fill="#9A9FA6" font-size="12" text-anchor="middle">摄像头 5</text>
      <path d="M318 74 l14 0 l0 10 l-14 0 z" fill="#ECEDEA"/>
    </svg>

    <!-- 事件卡挂在报警点旁 -->
    <section aria-label="北门有人翻越" class="panel" style="position:absolute;left:420px;top:24px;width:440px;border:4px solid #D42F33">
      <div style="display:flex;align-items:center;gap:12px;padding:12px 14px">
        <span style="width:28px;height:28px;border:7px solid #FF6166;border-radius:50%;box-sizing:border-box;flex:none"></span>
        <div style="flex:1"><h1 style="margin:0;font-size:20px;line-height:26px">北门有人翻越</h1><div style="color:#B4B8BE">P1 · 摄像头 3 · 23:47 · 1 分钟前 · 没人接手</div></div>
      </div>
      <div style="height:170px;margin:0 14px;position:relative;background:#000;border:1px solid #2E333A">
        <div style="position:absolute;inset:0;background:#07080A"></div>
        <div style="position:absolute;left:44%;top:22%;width:50px;height:90px;border:2px solid #FF6166"></div>
        <span style="position:absolute;left:8px;top:6px;color:#FF6166;font-weight:700">● 摄像头 3 实时</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px">
        <button class="btn pri" type="button"><span class="disc"></span>我来处理</button>
        <button class="btn" type="button">派 A（48 米 · 1 分钟）</button>
        <button class="btn" type="button">−30 秒</button>
        <button class="btn" type="button">详情</button>
      </div>
    </section>

    <!-- A 的画面挂在 A 旁边 -->
    <figure class="panel" style="position:absolute;left:1010px;top:150px;width:240px;margin:0">
      <div style="display:flex;align-items:center;gap:8px;padding:6px 10px"><b>A</b><span style="display:inline-flex;align-items:center;gap:6px;color:#3DC46E;font-weight:600"><span class="sq"></span>巡逻中</span><span style="flex:1"></span><span style="color:#F2B01E;font-weight:600">28%</span></div>
      <div style="height:120px;background:#000;border-top:1px solid #2E333A;position:relative"><div style="position:absolute;inset:0;background:#07080A"></div><span style="position:absolute;left:8px;bottom:6px;color:#9A9FA6;font-size:12px">A 前摄像头 · 实时</span></div>
    </figure>
    <figure class="panel" style="position:absolute;left:290px;top:520px;width:220px;margin:0">
      <div style="display:flex;align-items:center;gap:8px;padding:6px 10px"><b>B</b><span style="display:inline-flex;align-items:center;gap:6px;color:#FF6166;font-weight:600"><span class="ring" style="width:10px;height:10px;border-width:2px"></span>等换电</span><span style="flex:1"></span><span style="color:#FF6166;font-weight:600">6%</span></div>
    </figure>

    <!-- 右上：报警栈 -->
    <aside class="panel" aria-label="待处理" style="position:absolute;right:16px;top:16px;width:300px">
      <div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #2E333A"><h2 style="margin:0;font-size:15px">待处理 3</h2><a href="#">全部</a></div>
      <ul style="list-style:none;margin:0;padding:0">
        <li style="display:flex;gap:10px;align-items:center;padding:10px 14px;background:#33191B"><span class="ring"></span><span style="flex:1;font-weight:600">北门有人翻越</span><span style="color:#B4B8BE">23:47</span></li>
        <li style="display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid #2E333A"><span class="ring"></span><span style="flex:1;font-weight:600">B 等待换电</span><span style="color:#B4B8BE">23:31</span></li>
        <li style="display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid #2E333A"><span class="tri"></span><span style="flex:1;font-weight:600">A 电量低于 30%</span><span style="color:#B4B8BE">23:12</span></li>
      </ul>
    </aside>

    <div class="panel" style="position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column">
      <button class="btn" type="button" aria-label="放大" style="border:0;width:40px;justify-content:center;padding:0">+</button>
      <button class="btn" type="button" aria-label="缩小" style="border:0;border-top:1px solid #2E333A;width:40px;justify-content:center;padding:0">−</button>
      <button class="btn" type="button" style="border:0;border-top:1px solid #2E333A;padding:0 8px;font-size:12px">全图</button>
    </div>
    <div style="position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:8px;color:#B4B8BE"><span style="width:80px;height:6px;border:2px solid #B4B8BE;border-top:0"></span>20 米</div>
  </div>

  <!-- 底：整班时间轴 -->
  <section aria-label="本班时间轴" style="height:104px;flex:none;border-top:1px solid #2E333A;background:#0A0C0E;padding:10px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px">
    <div style="display:flex;justify-content:space-between" class="lbl"><span>本班 19:00 → 07:00 · 拖动看录像</span><span>巡逻 3 次 · 报警 7 · 已关 4</span></div>
    <div style="position:relative;height:56px">
      <div style="position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;color:#9A9FA6;font-size:12px"><span>19:00</span><span>21:00</span><span>23:00</span><span>01:00</span><span>03:00</span><span>05:00</span><span>07:00</span></div>
      <div style="position:absolute;left:0;right:0;top:22px;height:10px;background:#16191D"></div>
      <div style="position:absolute;left:0%;width:9%;top:22px;height:10px;background:#1F6FC0;opacity:.7"></div>
      <div style="position:absolute;left:25%;width:9%;top:22px;height:10px;background:#1F6FC0;opacity:.7"></div>
      <div style="position:absolute;left:50%;width:8%;top:22px;height:10px;background:#1F6FC0;opacity:.35"></div>
      <span class="ring" style="position:absolute;left:39.5%;top:38px;width:10px;height:10px;border-width:2px"></span>
      <span class="ring" style="position:absolute;left:37.2%;top:38px;width:10px;height:10px;border-width:2px"></span>
      <span class="tri" style="position:absolute;left:35%;top:38px;border-left-width:5px;border-right-width:5px;border-bottom-width:9px"></span>
      <span style="position:absolute;left:11%;top:38px;width:8px;height:8px;background:#9A9FA6"></span>
      <span style="position:absolute;left:22%;top:38px;width:8px;height:8px;background:#9A9FA6"></span>
      <div style="position:absolute;left:40.2%;top:14px;bottom:0;width:2px;background:#ECEDEA"></div>
      <span style="position:absolute;left:calc(40.2% + 6px);top:14px;font-size:12px;font-weight:700">现在 23:48</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
