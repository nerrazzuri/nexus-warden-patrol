<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App · Guard · One-off route</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.btn{height:44px;padding:0 14px;border:1px solid #9A9FA6;border-radius:2px;background:#16191D;color:#ECEDEA;font:600 15px Barlow,'Noto Sans SC','Microsoft YaHei UI',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;min-width:0}
.btn.sm{height:36px;padding:0 10px;font-size:14px}
.btn.pri{background:#1F6FC0;border-color:#1F6FC0;color:#fff;font-weight:700}
.btn.danger{background:transparent;border-color:#FF6166;color:#FF6166}
.btn.stop{background:#D42F33;border-color:#D42F33;color:#fff;font-weight:700}
.btn.ghost{background:transparent;border-color:transparent;color:#5AA2E6}
.row{display:grid;gap:8px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;color:#9A9FA6}
.mut{color:#B4B8BE}
.ring{display:inline-block;flex:none;width:14px;height:14px;border:3px solid #FF6166;border-radius:50%}
.ring.lg{width:26px;height:26px;border-width:5px}
.tri{display:inline-block;flex:none;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid #F2B01E}
.tri.lg{border-left-width:12px;border-right-width:12px;border-bottom-width:21px}
.sq{display:inline-block;flex:none;width:9px;height:9px;background:#3DC46E}
.off{display:inline-block;flex:none;width:14px;height:14px;border:2px solid #9A9FA6;border-radius:50%;background:linear-gradient(135deg,transparent 45%,#9A9FA6 45%,#9A9FA6 58%,transparent 58%)}
.disc{display:inline-block;flex:none;width:12px;height:12px;border-radius:50%;background:#fff}
.discb{display:inline-block;flex:none;width:12px;height:12px;border-radius:50%;background:#1F6FC0}
.p3{display:inline-block;flex:none;width:12px;height:12px;border:1.5px solid #9A9FA6;border-radius:50%}
.sec{padding:14px 16px;border-bottom:1px solid #2E333A}
.h2{margin:0;font-size:17px;line-height:24px;font-weight:600}
.h1{margin:0;font-size:22px;line-height:28px;font-weight:700}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;border-bottom:1px solid #2E333A;color:#ECEDEA;text-decoration:none}
.li .b{flex:1;min-width:0}
.li .s{font-size:13px;line-height:18px;color:#B4B8BE}
.seg{display:grid;border:1px solid #2E333A;border-radius:2px;padding:3px;gap:3px}
.seg button{height:36px;border:0;border-radius:2px;background:transparent;color:#B4B8BE;font:600 14px Barlow,'Noto Sans SC','Microsoft YaHei UI',sans-serif}
.seg button.on{background:#1F6FC0;color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:2px;font-size:13px;font-weight:600;white-space:nowrap}
.c-ok{background:#16281D;color:#3DC46E} .c-warn{background:#2D2512;color:#F2B01E} .c-bad{background:#33191B;color:#FF6166} .c-n{background:#20242A;color:#B4B8BE}
.vid{position:relative;background:#000;overflow:hidden}
.vid .cap{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(0,0,0,.65);color:#ECEDEA;font-size:13px}
.inp{height:44px;border:1px solid #9A9FA6;border-radius:2px;padding:0 12px;background:#16191D;color:#ECEDEA;font:400 15px Barlow,'Noto Sans SC','Microsoft YaHei UI',sans-serif;display:flex;align-items:center;width:100%}
.sw{width:44px;height:26px;border-radius:2px;background:#20242A;border:1px solid #9A9FA6;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:1px;background:#9A9FA6}
.sw.on{background:#1F6FC0;border-color:#1F6FC0} .sw.on::after{left:21px;background:#fff}
.note{font-size:13px;line-height:18px;color:#B4B8BE}
.tag{display:inline-block;padding:0 6px;border:1px solid #5AA2E6;color:#5AA2E6;font-size:11px;font-weight:700;line-height:16px}

</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#0E1013;color:#ECEDEA;font-family:Barlow,'Noto Sans SC','Microsoft YaHei UI',sans-serif;font-size:15px;line-height:22px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column">
<header style="flex:none;display:flex;align-items:center;gap:6px;min-height:56px;padding:6px 12px 6px 4px;background:#0A0C0E;border-bottom:1px solid #2E333A">
  <button type="button" aria-label="Back" style="width:44px;height:44px;border:0;background:transparent;color:#ECEDEA;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><polyline points="15,4 7,12 15,20"/></svg></button>
  <div style="flex:1;min-width:0"><div style="font-size:18px;font-weight:700;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">One-off route</div><div style="font-size:13px;line-height:18px;color:#B4B8BE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Tap points in order; runs once, not saved</div></div>
  <button class="btn sm" type="button" style="">Exit</button>
</header>
<div style="flex:1;min-height:0;position:relative">
  <svg width="390" height="400" viewBox="0 0 360 220" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;background:#20242A" role="img" aria-label="Site map">
  <rect x="14" y="14" width="332" height="192" fill="none" stroke="#5B6168" stroke-width="2"/>
  <rect x="150" y="40" width="96" height="70" fill="#2A2F35" stroke="#5B6168" stroke-width="1.5"/>
  <text x="198" y="80" text-anchor="middle" font-size="11" fill="#B4B8BE" font-family="Barlow">Building 2</text>
  <rect x="24" y="22" width="110" height="44" fill="none" stroke="#FF6166" stroke-width="1.2" stroke-dasharray="4 3" opacity=".8"/>
  <text x="30" y="60" font-size="10" fill="#B4B8BE" font-family="Barlow">North sector · Armed</text>
  <rect x="60" y="12" width="40" height="5" fill="#0E1013"/><text x="80" y="31" text-anchor="middle" font-size="10" fill="#B4B8BE" font-family="Barlow">North gate</text>
  <rect x="290" y="186" width="34" height="14" fill="none" stroke="#3DC46E" stroke-width="1.2"/><text x="307" y="181" text-anchor="middle" font-size="9" fill="#B4B8BE" font-family="Barlow">Dock 1</text>
  <rect x="34" y="130" width="90" height="62" fill="none" stroke="#5B6168" stroke-width="1" stroke-dasharray="2 3"/><text x="79" y="165" text-anchor="middle" font-size="10" fill="#B4B8BE" font-family="Barlow">Car park</text>
<polyline points="40,100 140,100 140,124 268,124 268,30 320,30 320,170 40,170 40,100" fill="none" stroke="#9A9FA6" stroke-width="1.5" stroke-dasharray="5 4"/><polyline points="214,70 80,150 150,150 150,196 250,196" fill="none" stroke="#5AA2E6" stroke-width="2.5"/><circle cx="214" cy="70" r="10" fill="#ECEDEA" stroke="#0E1013" stroke-width="2"/><text x="214" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#0E1013" font-family="Barlow">A</text><circle cx="300" cy="168" r="10" fill="#ECEDEA" stroke="#0E1013" stroke-width="2"/><text x="300" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#0E1013" font-family="Barlow">B</text><circle cx="80" cy="150" r="9" fill="#1F6FC0" stroke="#fff" stroke-width="2"/><text x="80" y="154" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Barlow">1</text><circle cx="150" cy="150" r="9" fill="#1F6FC0" stroke="#fff" stroke-width="2"/><text x="150" y="154" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Barlow">2</text><circle cx="150" cy="196" r="9" fill="#1F6FC0" stroke="#fff" stroke-width="2"/><text x="150" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Barlow">3</text><circle cx="250" cy="196" r="9" fill="#1F6FC0" stroke="#fff" stroke-width="2"/><text x="250" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Barlow">4</text><circle cx="340" cy="100" r="9" fill="none" stroke="#F2B01E" stroke-width="2.5" stroke-dasharray="3 2"/><text x="326" y="88" font-size="10" fill="#F2B01E" font-family="Barlow" text-anchor="end">Unreachable</text></svg>
  <section style="position:absolute;left:0;right:0;bottom:0;background:#16191D;border-top:1px solid #2E333A;padding:14px 16px 20px">
    <div style="width:36px;height:4px;background:#2E333A;margin:0 auto 12px"></div>
    <div style="display:flex;align-items:center"><b style="font-size:18px;flex:1">4 points · approx. 6 min</b><button class="btn sm" type="button" style="">Undo last point</button></div>
    <div class="note" style="margin:2px 0 10px">1 Car park N → 2 Car park centre → 3 Car park S → 4 East aisle</div>
    <div style="display:flex;gap:8px;align-items:flex-start;padding:10px;border:1px solid #F2B01E;background:#2D2512;margin-bottom:12px"><span class="tri" style="margin-top:4px"></span><span style="font-size:14px">The point outside the east wall is unreachable and was not added.</span></div>
    <div class="lbl" style="margin-bottom:6px">Robot · After the run</div>
    <div class="row" style="grid-template-columns:1fr 1fr"><button class="btn" type="button" style="background:#14273D;border-color:#1F6FC0">A · 1 min to start</button><button class="btn" type="button" style="">B · Charging 18%</button></div>
    <div style="height:8px"></div><div class="seg" style="grid-template-columns:1fr 1fr"><button class="on" type="button">Return to standby</button><button type="button">Resume previous patrol</button></div>
    <div style="height:12px"></div><div class="row" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><button class="btn pri" type="button" style="">Run once with A</button><button class="btn" type="button" style="">Cancel</button></div>
  </section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
