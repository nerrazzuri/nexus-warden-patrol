<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>App · 布防与巡逻</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.btn{height:44px;padding:0 14px;border:1px solid #6B7178;border-radius:2px;background:#FFFFFF;color:#15181B;font:600 15px Barlow,'Noto Sans SC','Microsoft YaHei UI',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;min-width:0}
.btn.sm{height:36px;padding:0 10px;font-size:14px}
.btn.pri{background:#0B5FA5;border-color:#0B5FA5;color:#fff;font-weight:700}
.btn.danger{background:transparent;border-color:#C8102E;color:#C8102E}
.btn.stop{background:#C8102E;border-color:#C8102E;color:#fff;font-weight:700}
.btn.ghost{background:transparent;border-color:transparent;color:#0B5FA5}
.row{display:grid;gap:8px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;color:#5F646A}
.mut{color:#474C52}
.ring{display:inline-block;flex:none;width:14px;height:14px;border:3px solid #C8102E;border-radius:50%}
.ring.lg{width:26px;height:26px;border-width:5px}
.tri{display:inline-block;flex:none;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid #F2A900}
.tri.lg{border-left-width:12px;border-right-width:12px;border-bottom-width:21px}
.sq{display:inline-block;flex:none;width:9px;height:9px;background:#0F7A3C}
.off{display:inline-block;flex:none;width:14px;height:14px;border:2px solid #5F646A;border-radius:50%;background:linear-gradient(135deg,transparent 45%,#5F646A 45%,#5F646A 58%,transparent 58%)}
.disc{display:inline-block;flex:none;width:12px;height:12px;border-radius:50%;background:#fff}
.discb{display:inline-block;flex:none;width:12px;height:12px;border-radius:50%;background:#0B5FA5}
.p3{display:inline-block;flex:none;width:12px;height:12px;border:1.5px solid #5F646A;border-radius:50%}
.sec{padding:14px 16px;border-bottom:1px solid #D3D6D2}
.h2{margin:0;font-size:17px;line-height:24px;font-weight:600}
.h1{margin:0;font-size:22px;line-height:28px;font-weight:700}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;border-bottom:1px solid #D3D6D2;color:#15181B;text-decoration:none}
.li .b{flex:1;min-width:0}
.li .s{font-size:13px;line-height:18px;color:#474C52}
.seg{display:grid;border:1px solid #D3D6D2;border-radius:2px;padding:3px;gap:3px}
.seg button{height:36px;border:0;border-radius:2px;background:transparent;color:#474C52;font:600 14px Barlow,'Noto Sans SC','Microsoft YaHei UI',sans-serif}
.seg button.on{background:#0B5FA5;color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:2px;font-size:13px;font-weight:600;white-space:nowrap}
.c-ok{background:#E3F2E8;color:#0F7A3C} .c-warn{background:#FBF0D2;color:#8A5A00} .c-bad{background:#FBE4E7;color:#C8102E} .c-n{background:#ECEEEB;color:#474C52}
.vid{position:relative;background:#000;overflow:hidden}
.vid .cap{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(0,0,0,.65);color:#ECEDEA;font-size:13px}
.inp{height:44px;border:1px solid #6B7178;border-radius:2px;padding:0 12px;background:#FFFFFF;color:#15181B;font:400 15px Barlow,'Noto Sans SC','Microsoft YaHei UI',sans-serif;display:flex;align-items:center;width:100%}
.sw{width:44px;height:26px;border-radius:2px;background:#ECEEEB;border:1px solid #6B7178;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:1px;background:#5F646A}
.sw.on{background:#0B5FA5;border-color:#0B5FA5} .sw.on::after{left:21px;background:#fff}
.note{font-size:13px;line-height:18px;color:#474C52}
.tag{display:inline-block;padding:0 6px;border:1px solid #0B5FA5;color:#0B5FA5;font-size:11px;font-weight:700;line-height:16px}

</style>
</helmet>
<div style="width:390px;height:1200px;position:relative;overflow:hidden;background:#F5F6F4;color:#15181B;font-family:Barlow,'Noto Sans SC','Microsoft YaHei UI',sans-serif;font-size:15px;line-height:22px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column">
<header style="flex:none;display:flex;align-items:center;gap:6px;min-height:56px;padding:6px 12px 6px 4px;background:#FFFFFF;border-bottom:1px solid #D3D6D2">
  <button type="button" aria-label="返回" style="width:44px;height:44px;border:0;background:transparent;color:#15181B;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><polyline points="15,4 7,12 15,20"/></svg></button>
  <div style="flex:1;min-width:0"><div style="font-size:18px;font-weight:700;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">布防与巡逻</div><div style="font-size:13px;line-height:18px;color:#474C52;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">撤防 · 19:00 布防</div></div>
  <button type="button" aria-label="全部急停" style="height:40px;padding:0 10px;border:0;border-radius:2px;background:#D42F33;color:#fff;font:700 14px Barlow,'Noto Sans SC','Microsoft YaHei UI',sans-serif;display:inline-flex;align-items:center;gap:6px;flex:none"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><polygon points="8,2 16,2 22,8 22,16 16,22 8,22 2,16 2,8"/><line x1="7" y1="12" x2="17" y2="12"/></svg>急停</button>
</header><div style="flex:1;min-height:0;background:#F5F6F4"><section style="background:#FFFFFF;border-bottom:1px solid #D3D6D2;padding:14px 16px;margin-top:8px">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><h2 class="h2" style="flex:1">现在</h2></div><div class="seg" style="grid-template-columns:repeat(3,1fr)"><button type="button">布防</button><button type="button">留守</button><button class="on" type="button">撤防</button></div><div class="note" style="margin-top:8px">撤防 · 19:00 按时间表自动布防。入侵来了：撤防时只记录，不派机器人、不响。</div></section><section style="background:#FFFFFF;border-bottom:1px solid #D3D6D2;padding:14px 16px;margin-top:8px">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><h2 class="h2" style="flex:1">临时撤防</h2></div><div class="note" style="margin-bottom:10px">某个防区先撤防一段时间，到点自己恢复。</div><div class="row" style="grid-template-columns:repeat(1,minmax(0,1fr));gap:8px"><button class="btn" type="button" style="">按防区临时撤防…</button></div></section><section style="background:#FFFFFF;border-bottom:1px solid #D3D6D2;padding:14px 16px;margin-top:8px">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><h2 class="h2" style="flex:1">布防时间表</h2></div><div style="display:flex;gap:10px;align-items:center;min-height:44px;border-top:1px solid #D3D6D2"><span style="flex:1">周一至周五</span><b>19:00 → 07:00</b></div><div style="display:flex;gap:10px;align-items:center;min-height:44px;border-top:1px solid #D3D6D2"><span style="flex:1">周六、周日</span><b>全天</b></div><div style="display:flex;gap:10px;align-items:center;min-height:44px;border-top:1px solid #D3D6D2"><span style="flex:1">例外 · 11-20</span><b>施工，22:00 才布防</b></div><div style="height:10px"></div><div class="row" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><button class="btn sm" type="button" style="">改时间表</button><button class="btn sm" type="button" style="">加例外</button></div></section><section style="background:#FFFFFF;border-bottom:1px solid #D3D6D2;padding:14px 16px;margin-top:8px">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><h2 class="h2" style="flex:1">天气</h2></div><div style="display:flex;gap:10px;align-items:center"><span class="sq"></span><span style="flex:1">正常 · 自动</span><button class="btn sm" type="button" style="">手动设</button></div><div class="note" style="margin-top:6px">下雨照常巡逻；雷暴时日程巡逻暂停。</div></section><section style="margin-top:8px"><div class="lbl" style="padding:14px 16px 6px">巡逻</div><div style="background:#FFFFFF;border-top:1px solid #D3D6D2"><a href="#" class="li"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#474C52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="12" cy="12" r="8"/><polyline points="12,7 12,12 15,14"/></svg><div class="b"><div style="font-weight:600;display:flex;align-items:center;gap:8px">巡逻日程</div><div class="s">每晚 4 轮 · guard-1</div></div><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#5F646A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><polyline points="9,5 16,12 9,19"/></svg></a><a href="#" class="li"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#474C52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg><div class="b"><div style="font-weight:600;display:flex;align-items:center;gap:8px">布防时巡逻</div><div class="s">布防时每 3 小时一轮</div></div><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#5F646A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><polyline points="9,5 16,12 9,19"/></svg></a><a href="#" class="li"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#474C52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><div class="b"><div style="font-weight:600;display:flex;align-items:center;gap:8px">报警演练</div><div class="s">试一次报警，看手机响不响</div></div><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#5F646A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><polyline points="9,5 16,12 9,19"/></svg></a></div></section></div><div aria-hidden="true" style="position:absolute;left:0;right:0;top:844px;border-top:1px dashed #0B5FA5;z-index:6"><span style="position:absolute;right:4px;top:-18px;font-size:11px;font-weight:600;color:#0B5FA5">第一屏到这里</span></div>
</div>
