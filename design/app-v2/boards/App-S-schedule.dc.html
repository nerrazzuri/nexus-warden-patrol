<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.btn{height:44px;padding:0 14px;border:1px solid #6B7178;border-radius:2px;background:#FFFFFF;color:#15181B;font:600 15px Barlow,'Noto Sans SC','Microsoft YaHei UI',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;min-width:0}
.btn.sm{height:36px;padding:0 10px;font-size:14px}
.btn.pri{background:#0B5FA5;border-color:#0B5FA5;color:#fff;font-weight:700}
.btn.danger{background:transparent;border-color:#C8102E;color:#C8102E}
.btn.stop{background:#C8102E;border-color:#C8102E;color:#fff;font-weight:700}
.btn.ghost{background:transparent;border-color:transparent;color:#0B5FA5}
.row{display:grid;gap:8px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;color:#5F646A}
.mut{color:#474C52}
.ring{display:inline-block;flex:none;width:14px;height:14px;border:3px solid #C8102E;border-radius:50%}
.ring.lg{width:26px;height:26px;border-width:5px}
.tri{display:inline-block;flex:none;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid #F2A900}
.tri.lg{border-left-width:12px;border-right-width:12px;border-bottom-width:21px}
.sq{display:inline-block;flex:none;width:9px;height:9px;background:#0F7A3C}
.off{display:inline-block;flex:none;width:14px;height:14px;border:2px solid #5F646A;border-radius:50%;background:linear-gradient(135deg,transparent 45%,#5F646A 45%,#5F646A 58%,transparent 58%)}
.disc{display:inline-block;flex:none;width:12px;height:12px;border-radius:50%;background:#fff}
.discb{display:inline-block;flex:none;width:12px;height:12px;border-radius:50%;background:#0B5FA5}
.p3{display:inline-block;flex:none;width:12px;height:12px;border:1.5px solid #5F646A;border-radius:50%}
.sec{padding:14px 16px;border-bottom:1px solid #D3D6D2}
.h2{margin:0;font-size:17px;line-height:24px;font-weight:600}
.h1{margin:0;font-size:22px;line-height:28px;font-weight:700}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;border-bottom:1px solid #D3D6D2;color:#15181B;text-decoration:none}
.li .b{flex:1;min-width:0}
.li .s{font-size:13px;line-height:18px;color:#474C52}
.seg{display:grid;border:1px solid #D3D6D2;border-radius:2px;padding:3px;gap:3px}
.seg button{height:36px;border:0;border-radius:2px;background:transparent;color:#474C52;font:600 14px Barlow,'Noto Sans SC','Microsoft YaHei UI',sans-serif}
.seg button.on{background:#0B5FA5;color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:2px;font-size:13px;font-weight:600;white-space:nowrap}
.c-ok{background:#E3F2E8;color:#0F7A3C} .c-warn{background:#FBF0D2;color:#8A5A00} .c-bad{background:#FBE4E7;color:#C8102E} .c-n{background:#ECEEEB;color:#474C52}
.vid{position:relative;background:#000;overflow:hidden}
.vid .cap{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(0,0,0,.65);color:#ECEDEA;font-size:13px}
.inp{height:44px;border:1px solid #6B7178;border-radius:2px;padding:0 12px;background:#FFFFFF;color:#15181B;font:400 15px Barlow,'Noto Sans SC','Microsoft YaHei UI',sans-serif;display:flex;align-items:center;width:100%}
.sw{width:44px;height:26px;border-radius:2px;background:#ECEEEB;border:1px solid #6B7178;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:1px;background:#5F646A}
.sw.on{background:#0B5FA5;border-color:#0B5FA5} .sw.on::after{left:21px;background:#fff}
.note{font-size:13px;line-height:18px;color:#474C52}
.tag{display:inline-block;padding:0 6px;border:1px solid #0B5FA5;color:#0B5FA5;font-size:11px;font-weight:700;line-height:16px}

</style>
</helmet>
<div style="width:390px;height:1150px;position:relative;overflow:hidden;background:#F5F6F4;color:#15181B;font-family:Barlow,'Noto Sans SC','Microsoft YaHei UI',sans-serif;font-size:15px;line-height:22px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column">

  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><h2 class="h2" style="flex:1">编辑：01:00 夜巡</h2></div><div style="display:grid;gap:10px"><div><div class="lbl" style="margin-bottom:4px">几点</div><div class="inp">01:00</div></div><div><div class="lbl" style="margin-bottom:4px">哪几天</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px"><span style="height:32px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;background:#0B5FA5;color:#fff">一</span><span style="height:32px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;background:#0B5FA5;color:#fff">二</span><span style="height:32px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;background:#0B5FA5;color:#fff">三</span><span style="height:32px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;background:#0B5FA5;color:#fff">四</span><span style="height:32px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;background:#0B5FA5;color:#fff">五</span><span style="height:32px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;border:1px solid #6B7178">六</span><span style="height:32px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;border:1px solid #6B7178">日</span></div></div><div><div class="lbl" style="margin-bottom:4px">路线 · 机器人</div><div class="row" style="grid-template-columns:1fr 1fr"><div class="inp">guard-1</div><div class="inp">哪台空就哪台</div></div></div><div class="note">每趟约 14 分钟（含返回）。</div></div><div style="height:12px"></div><div class="row" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><button class="btn pri" type="button" style="">保存</button><button class="btn danger" type="button" style="">删除</button></div></section><div style="padding:12px 16px"><div class="row" style="grid-template-columns:repeat(1,minmax(0,1fr));gap:8px"><button class="btn" type="button" style=""><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>添加日程</button></div></div></div><div aria-hidden="true" style="position:absolute;left:0;right:0;top:844px;border-top:1px dashed #0B5FA5;z-index:6"><span style="position:absolute;right:4px;top:-18px;font-size:11px;font-weight:600;color:#0B5FA5">第一屏到这里</span></div>
