version: 1
defaults:
  timeout_s: 90
  start_jitter_xy_m: 0.15
  start_jitter_yaw_deg: 10
  obstacle_jitter_xy_m: 0.15
  goal_jitter_xy_m: 0.08
  goal_jitter_yaw_deg: 5
  map_size_m: [18, 18]
  resolution_m: 0.05
  boundary_wall_thickness_m: 0.20
  safety_min_clearance_m: 0.08
  # 起点/目标处车身离障碍(含边界墙)少于这个就拒绝生成:停不进去的目标不是导航失败。
  min_pose_clearance_m: 0.20

scenarios:
  - id: straight_open
    start: [-6.0, 0.0, 0.0]
    goals: [[6.0, 0.0, 0.0]]
    obstacles: []

  - id: straight_return
    start: [-6.0, 0.0, 0.0]
    goals: [[6.0, 0.0, 0.0], [-6.0, 0.0, 3.14159]]
    obstacles: []

  - id: center_box_outbound_return
    start: [-6.0, 0.0, 0.0]
    goals: [[6.0, 0.0, 0.0], [-6.0, 0.0, 3.14159]]
    obstacles:
      - {x: 0.0, y: 0.0, sx: 1.0, sy: 1.0}

  - id: center_box_offset
    start: [-6.0, -1.5, 0.0]
    goals: [[6.0, 1.5, 0.0], [-6.0, -1.5, 3.14159]]
    obstacles:
      - {x: 0.0, y: 0.0, sx: 1.2, sy: 1.2}

  - id: ninety_left
    start: [-5.5, -5.5, 0.0]
    goals: [[-1.0, -5.5, 0.0], [-1.0, 4.5, 1.5708]]
    obstacles:
      - {x: 1.0, y: -1.0, sx: 0.8, sy: 5.0}

  - id: ninety_right
    start: [-5.5, 5.5, 0.0]
    goals: [[-1.0, 5.5, 0.0], [-1.0, -4.5, -1.5708]]
    obstacles:
      - {x: 1.0, y: 1.0, sx: 0.8, sy: 5.0}

  - id: narrow_gate_090
    start: [-5.5, 0.0, 0.0]
    goals: [[5.5, 0.0, 0.0]]
    obstacles:
      - {x: 0.0, y: 1.55, sx: 0.7, sy: 2.2}
      - {x: 0.0, y: -1.55, sx: 0.7, sy: 2.2}

  - id: narrow_gate_return
    start: [-5.5, 0.0, 0.0]
    goals: [[5.5, 0.0, 0.0], [-5.5, 0.0, 3.14159]]
    obstacles:
      - {x: 0.0, y: 1.50, sx: 0.7, sy: 2.1}
      - {x: 0.0, y: -1.50, sx: 0.7, sy: 2.1}

  # 墙边目标:停好后侧面离墙约 0.6 m(= 膨胀半径),抖动后最少约 0.37 m。
  # 原来 x=5.8 时车身跟墙重叠,停不进去。
  - id: wall_side_goal
    start: [-5.5, -4.0, 0.0]
    goals: [[4.8, 5.7, 1.5708]]
    obstacles:
      - {x: 5.9, y: 3.3, sx: 0.4, sy: 4.0}

  # 原来 x=5.5 时侧面离墙 0.11 m,膨胀区里控制器停不到 0.2 m 容差内,超时。
  - id: wall_side_turnaround
    start: [-5.5, -4.0, 0.0]
    goals: [[5.0, 4.8, 1.5708], [-5.5, -4.0, -3.14159]]
    obstacles:
      - {x: 6.1, y: 3.0, sx: 0.4, sy: 4.5}

  - id: slalom_three
    start: [-6.0, 0.0, 0.0]
    goals: [[6.0, 0.0, 0.0]]
    obstacles:
      - {x: -2.0, y: 1.3, sx: 1.0, sy: 1.0}
      - {x: 0.0, y: -1.3, sx: 1.0, sy: 1.0}
      - {x: 2.0, y: 1.3, sx: 1.0, sy: 1.0}

  - id: slalom_return
    start: [-6.0, 0.0, 0.0]
    goals: [[6.0, 0.0, 0.0], [-6.0, 0.0, 3.14159]]
    obstacles:
      - {x: -2.0, y: 1.3, sx: 1.0, sy: 1.0}
      - {x: 0.0, y: -1.3, sx: 1.0, sy: 1.0}
      - {x: 2.0, y: 1.3, sx: 1.0, sy: 1.0}

  - id: u_shape_entry
    start: [-6.0, 0.0, 0.0]
    goals: [[1.0, 0.0, 0.0]]
    obstacles:
      - {x: 1.8, y: 2.0, sx: 4.0, sy: 0.5}
      - {x: 1.8, y: -2.0, sx: 4.0, sy: 0.5}
      - {x: 3.8, y: 0.0, sx: 0.5, sy: 4.5}

  - id: u_shape_escape
    start: [1.0, 0.0, 3.14159]
    goals: [[-6.0, 0.0, 3.14159]]
    obstacles:
      - {x: 1.8, y: 2.0, sx: 4.0, sy: 0.5}
      - {x: 1.8, y: -2.0, sx: 4.0, sy: 0.5}
      - {x: 3.8, y: 0.0, sx: 0.5, sy: 4.5}

  - id: corridor_long
    start: [-6.5, 0.0, 0.0]
    goals: [[6.5, 0.0, 0.0]]
    obstacles:
      - {x: 0.0, y: 2.0, sx: 13.0, sy: 0.35}
      - {x: 0.0, y: -2.0, sx: 13.0, sy: 0.35}

  - id: corridor_turn_return
    start: [-6.0, 0.0, 0.0]
    goals: [[4.5, 0.0, 0.0], [4.5, 3.8, 1.5708], [-6.0, 0.0, 3.14159]]
    obstacles:
      - {x: 0.0, y: 2.0, sx: 12.0, sy: 0.35}
      - {x: 0.0, y: -2.0, sx: 12.0, sy: 0.35}
      - {x: 6.0, y: 2.5, sx: 0.35, sy: 5.0}

  - id: staggered_boxes
    start: [-6.0, -4.5, 0.2]
    goals: [[6.0, 4.5, 0.8]]
    obstacles:
      - {x: -3.0, y: -2.0, sx: 1.5, sy: 1.0}
      - {x: 0.0, y: 0.0, sx: 1.5, sy: 1.0}
      - {x: 3.0, y: 2.0, sx: 1.5, sy: 1.0}

  - id: staggered_boxes_return
    start: [-6.0, -4.5, 0.2]
    goals: [[6.0, 4.5, 0.8], [-6.0, -4.5, -2.9]]
    obstacles:
      - {x: -3.0, y: -2.0, sx: 1.5, sy: 1.0}
      - {x: 0.0, y: 0.0, sx: 1.5, sy: 1.0}
      - {x: 3.0, y: 2.0, sx: 1.5, sy: 1.0}

  - id: offset_gate_turn
    start: [-6.0, -4.0, 0.0]
    goals: [[0.0, -1.0, 0.4], [5.5, 4.5, 1.2]]
    obstacles:
      - {x: -0.2, y: 1.4, sx: 0.8, sy: 2.8}
      - {x: 1.7, y: -1.5, sx: 0.8, sy: 2.8}

  - id: reverse_pressure
    start: [0.0, 0.0, 0.0]
    goals: [[-5.5, 0.0, 3.14159], [5.5, 0.0, 0.0]]
    obstacles:
      - {x: -2.0, y: 1.2, sx: 0.8, sy: 1.0}
      - {x: 2.0, y: -1.2, sx: 0.8, sy: 1.0}

  # 原来的假障碍只加在雷达数据里、跟着机器人走;改成世界里真的有一个人横穿,去程回程各一次。
  - id: dynamic_crossing
    start: [-6.0, 0.0, 0.0]
    goals: [[6.0, 0.0, 0.0], [-6.0, 0.0, 3.14159]]
    obstacles: []
    actors:
      - {name: p1, kind: person, sx: 0.5, sy: 0.5, h: 1.7, speed: 1.0, mode: once,
         path: [[2.2, -5.0], [2.2, 5.0]], start: {robot_within: [-1.5, 0.0, 1.0]}}
      - {name: p2, kind: person, sx: 0.5, sy: 0.5, h: 1.7, speed: 1.0, mode: once,
         path: [[-1.5, 5.0], [-1.5, -5.0]], start: {robot_within: [2.5, 0.0, 1.0]}}

  # ------------------------------------------------------------------ 安防场景(11-07)
  # unmapped: 建图后才出现的东西,世界里有、地图上没有,只能靠雷达现场看见。
  # actors: 行人(橙)/车辆(蓝),按路线移动;机器人在动时碰上算失败,停着被碰到单独记。
  # expect: blocked = 过不去是对的,不撞就算通过。

  # 1 服务走廊(2.5 m 宽)中间靠墙停了一辆推车
  - id: sec_corridor_cart
    start: [-7.0, 0.0, 0.0]
    goals: [[7.0, 0.0, 0.0], [-7.0, 0.0, 3.14159]]
    obstacles:
      - {x: 0.0, y: 1.40, sx: 16.0, sy: 0.30}
      - {x: 0.0, y: -1.40, sx: 16.0, sy: 0.30}
      - {x: 0.5, y: 0.75, sx: 1.2, sy: 0.7, h: 1.0, unmapped: true}

  # 2 走廊被一排栈板完全堵死(走廊两头封到边界墙,没得绕)
  - id: sec_corridor_blocked
    expect: blocked
    timeout_s: 60
    start: [-7.0, 0.0, 0.0]
    goals: [[7.0, 0.0, 0.0]]
    obstacles:
      - {x: 0.0, y: 1.40, sx: 17.6, sy: 0.30}
      - {x: 0.0, y: -1.40, sx: 17.6, sy: 0.30}
      - {x: 0.0, y: 0.0, sx: 0.8, sy: 2.8, h: 1.2, unmapped: true}

  # 3 3 m 宽走廊,有人迎面走来(走的是中线略偏,不会主动让)
  - id: sec_headon_pedestrian
    start: [-7.0, 0.0, 0.0]
    goals: [[7.0, 0.0, 0.0], [-7.0, 0.0, 3.14159]]
    obstacles:
      - {x: 0.0, y: 1.65, sx: 16.0, sy: 0.30}
      - {x: 0.0, y: -1.65, sx: 16.0, sy: 0.30}
    actors:
      - {name: p1, kind: person, sx: 0.5, sy: 0.5, h: 1.7, speed: 1.2, mode: once,
         path: [[7.5, 0.2], [-7.5, 0.2]], start: {robot_within: [-4.5, 0.0, 1.0]}}

  # 4 大厅里两个人先后横穿机器人路线
  - id: sec_crossing_pedestrians
    start: [-7.0, -1.0, 0.0]
    goals: [[7.0, -1.0, 0.0], [-7.0, -1.0, 3.14159]]
    obstacles: []
    actors:
      - {name: p1, kind: person, sx: 0.5, sy: 0.5, h: 1.7, speed: 1.0, mode: once,
         path: [[-1.0, 6.0], [-1.0, -7.5]], start: {robot_within: [-4.0, -1.0, 1.0]}}
      - {name: p2, kind: person, sx: 0.5, sy: 0.5, h: 1.7, speed: 1.4, mode: once,
         path: [[3.0, -7.5], [3.0, 6.0]], start: {robot_within: [0.0, -1.0, 1.0]}}

  # 5 大堂:四根柱子(地图上有),五个人来回走,机器人绕三个巡逻点
  - id: sec_lobby_crowd
    timeout_s: 120
    start: [-7.0, -7.0, 0.0]
    goals: [[6.0, -6.0, 1.5708], [6.0, 6.0, 3.14159], [-6.0, 5.0, -1.5708]]
    obstacles:
      - {x: -3.0, y: -3.0, sx: 0.8, sy: 0.8}
      - {x: 3.0, y: -3.0, sx: 0.8, sy: 0.8}
      - {x: -3.0, y: 3.0, sx: 0.8, sy: 0.8}
      - {x: 3.0, y: 3.0, sx: 0.8, sy: 0.8}
    actors:
      - {name: p1, kind: person, sx: 0.5, sy: 0.5, h: 1.7, speed: 1.0, mode: pingpong, path: [[-6.0, 0.0], [6.0, 0.0]]}
      - {name: p2, kind: person, sx: 0.5, sy: 0.5, h: 1.7, speed: 0.9, mode: pingpong, path: [[0.0, -7.0], [0.0, 7.0]]}
      - {name: p3, kind: person, sx: 0.5, sy: 0.5, h: 1.7, speed: 1.1, mode: pingpong, path: [[-6.0, -4.5], [6.0, 4.5]]}
      - {name: p4, kind: person, sx: 0.5, sy: 0.5, h: 1.7, speed: 0.8, mode: pingpong, path: [[-7.0, 7.5], [7.0, 7.5]]}
      - {name: p5, kind: person, sx: 0.5, sy: 0.5, h: 1.7, speed: 0.7, mode: loop,
         path: [[-1.5, -6.5], [1.5, -6.5], [1.5, -1.5], [-1.5, -1.5]]}

  # 6 门口(1.6 m 宽)站着一个人,25 秒后走开:机器人要等,然后通过
  - id: sec_doorway_loiterer
    timeout_s: 120
    start: [-6.0, 0.0, 0.0]
    goals: [[6.0, 0.0, 0.0], [-6.0, 0.0, 3.14159]]
    obstacles:
      - {x: 0.0, y: 4.9, sx: 0.30, sy: 8.2}
      - {x: 0.0, y: -4.9, sx: 0.30, sy: 8.2}
    actors:
      - {name: p1, kind: person, sx: 0.5, sy: 0.5, h: 1.7, speed: 0.8, mode: once,
         path: [[0.0, 0.0, 25.0], [2.0, 3.0]], start: {at_s: 0.0}}

  # 7 柱子后面突然走出一个人(机器人离柱子约 2.5 m 时出来,横穿路线)
  - id: sec_popout_pillar
    start: [-7.0, 0.0, 0.0]
    goals: [[7.0, 0.0, 0.0]]
    obstacles:
      - {x: 1.0, y: 1.4, sx: 1.2, sy: 1.2}
    actors:
      - {name: p1, kind: person, sx: 0.5, sy: 0.5, h: 1.7, speed: 1.3, mode: once,
         path: [[1.0, 2.6], [1.0, -3.0]], start: {robot_within: [-1.5, 0.0, 0.6]}}

  # 8 停车场:两排停好的车(地图上有),一辆车沿车道迎面开过来
  - id: sec_parking_lot
    timeout_s: 120
    start: [-7.5, 0.0, 0.0]
    goals: [[7.5, 0.0, 0.0], [-7.5, 0.0, 3.14159]]
    obstacles:
      - {x: -6.0, y: 4.6, sx: 1.8, sy: 4.5}
      - {x: -3.5, y: 4.6, sx: 1.8, sy: 4.5}
      - {x: -1.0, y: 4.6, sx: 1.8, sy: 4.5}
      - {x: 1.5, y: 4.6, sx: 1.8, sy: 4.5}
      - {x: 4.0, y: 4.6, sx: 1.8, sy: 4.5}
      - {x: 6.5, y: 4.6, sx: 1.8, sy: 4.5}
      - {x: -6.0, y: -4.6, sx: 1.8, sy: 4.5}
      - {x: -3.5, y: -4.6, sx: 1.8, sy: 4.5}
      - {x: -1.0, y: -4.6, sx: 1.8, sy: 4.5}
      - {x: 1.5, y: -4.6, sx: 1.8, sy: 4.5}
      - {x: 4.0, y: -4.6, sx: 1.8, sy: 4.5}
      - {x: 6.5, y: -4.6, sx: 1.8, sy: 4.5}
    actors:
      - {name: car1, kind: vehicle, sx: 4.5, sy: 1.8, h: 1.5, speed: 2.0, mode: once,
         path: [[8.5, -1.0], [-8.5, -1.0]], start: {robot_within: [-3.0, 0.0, 1.0]}}

  # 9 巡逻环线上临时放了施工围挡(地图上没有),旁边有路可绕
  - id: sec_construction_detour
    timeout_s: 120
    start: [-7.0, -6.0, 0.0]
    goals: [[6.0, -6.0, 1.5708], [6.0, 6.0, 3.14159], [-6.0, 6.0, -1.5708], [-7.0, -6.0, 0.0]]
    obstacles:
      - {x: 0.0, y: -6.0, sx: 0.4, sy: 3.0, unmapped: true}
      - {x: 6.0, y: 0.0, sx: 3.0, sy: 0.4, unmapped: true}
      - {x: 0.0, y: 6.0, sx: 0.4, sy: 3.0, unmapped: true}

  # ------------------------------------------------------------------ 现场地图(11-07)
  # site_map:Nav2 用的图 = 正式系统发给 Nav2 的那张(建图的 floor.pgm + 禁行区烧成挡);仿真世界的墙
  # = 地图上的黑格(建图时雷达真看见的),只取 crop 范围。坐标就是现场地图坐标。

  # 11-05 广场:从花坛东边的点去西边的点,只能穿花坛尖和南墙之间的缝(最窄约 1.15 m),机器人卡在缝口。
  # 路线点取自现场录包(规划终点)和代理日志。
  - id: plaza_narrow_gap
    timeout_s: 120
    min_pose_clearance_m: 0.05       # 现场那个点本来就贴墙(车身离墙 0.19 m),照原样测
    site_map:
      dir: runs/field-c40221/maps-build/plaza-c40221-v2
      nogo: runs/field-c40221/maps-build/plaza-c40221-v2-nogo-user.json
      crop: [12.0, 34.0, -22.0, 2.0]
    start: [27.27, -9.28, -1.209]
    goals: [[29.77, -15.88, -1.209], [21.57, -15.59, 3.106], [18.14, -8.51, 2.022]]
    obstacles: []

  # 同一处,只测穿缝:从现场第 1 个点(贴墙,先到不到位跟缝无关)直接出发去西边的点。
  - id: plaza_narrow_gap_only
    timeout_s: 120
    min_pose_clearance_m: 0.05
    site_map:
      dir: runs/field-c40221/maps-build/plaza-c40221-v2
      nogo: runs/field-c40221/maps-build/plaza-c40221-v2-nogo-user.json
      crop: [12.0, 34.0, -22.0, 2.0]
    start: [29.77, -15.88, -1.209]
    goals: [[21.57, -15.59, 3.106]]
    obstacles: []

  # ------------------------------------------------------------------ 窄路族(11-07,自动生成)
  # 标准:每边余量 ≥ 0.2 m(宽 ≥ 0.98 m)必须过;放不下(0.9 m)必须停住、不撞(expect blocked)。
  # L:从开阔处拐进窄走廊(广场花坛尖那种);S:两道墙上错开的窄门,中间要转身;
  # deadend:窄死胡同,点在里面,掉不了头只能倒出来。
  - id: tight_L_w090
    expect: blocked
    timeout_s: 120
    min_pose_clearance_m: 0.05
    start: [5.0, 3.0, -1.5708]
    goals: [[-6.0, -2.550, 3.14159]]
    obstacles:
      - {x: -3.000, y: -3.150, sx: 10.000, sy: 0.300}
      - {x: -3.000, y: 1.950, sx: 10.000, sy: 8.100}
  - id: tight_S_w090
    expect: blocked
    timeout_s: 120
    min_pose_clearance_m: 0.05
    start: [-6.0, -1.0, 0.0]
    goals: [[6.0, 1.0, 0.0]]
    obstacles:
      - {x: -1.000, y: -5.225, sx: 0.300, sy: 7.550}
      - {x: -1.000, y: 4.225, sx: 0.300, sy: 9.550}
      - {x: 1.000, y: -4.225, sx: 0.300, sy: 9.550}
      - {x: 1.000, y: 5.225, sx: 0.300, sy: 7.550}
  - id: tight_L_w100
    timeout_s: 120
    min_pose_clearance_m: 0.05
    start: [5.0, 3.0, -1.5708]
    goals: [[-6.0, -2.500, 3.14159], [5.0, 3.0, 1.5708]]
    obstacles:
      - {x: -3.000, y: -3.150, sx: 10.000, sy: 0.300}
      - {x: -3.000, y: 2.000, sx: 10.000, sy: 8.000}
  - id: tight_S_w100
    timeout_s: 120
    min_pose_clearance_m: 0.05
    start: [-6.0, -1.0, 0.0]
    goals: [[6.0, 1.0, 0.0], [-6.0, -1.0, 3.14159]]
    obstacles:
      - {x: -1.000, y: -5.250, sx: 0.300, sy: 7.500}
      - {x: -1.000, y: 4.250, sx: 0.300, sy: 9.500}
      - {x: 1.000, y: -4.250, sx: 0.300, sy: 9.500}
      - {x: 1.000, y: 5.250, sx: 0.300, sy: 7.500}
  - id: tight_deadend_w100
    timeout_s: 120
    min_pose_clearance_m: 0.05
    start: [-5.0, 0.0, 0.0]
    goals: [[3.2, 0.0, 0.0], [-5.0, 0.0, 3.14159]]
    obstacles:
      - {x: 2.000, y: 0.650, sx: 4.000, sy: 0.300}
      - {x: 2.000, y: -0.650, sx: 4.000, sy: 0.300}
      - {x: 4.150, y: 0.000, sx: 0.300, sy: 1.600}
  - id: tight_L_w115
    timeout_s: 120
    min_pose_clearance_m: 0.05
    start: [5.0, 3.0, -1.5708]
    goals: [[-6.0, -2.425, 3.14159], [5.0, 3.0, 1.5708]]
